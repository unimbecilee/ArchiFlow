services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: esag_ged_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: esag_ged
      POSTGRES_USER: esag_user
      POSTGRES_PASSWORD: esag_password_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - esag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esag_user -d esag_ged"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Migrations
  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    container_name: esag_ged_migrations
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: esag_ged
      POSTGRES_USER: esag_user
      POSTGRES_PASSWORD: esag_password_2024
      DATABASE_URL: postgresql://esag_user:esag_password_2024@postgres:5432/esag_ged
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esag_network
    restart: "no"

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: esag_ged_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console Web
    volumes:
      - minio_data:/data
    networks:
      - esag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client pour initialisation
  minio-init:
    image: minio/mc:latest
    container_name: esag_ged_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/esag-documents --ignore-existing;
      /usr/bin/mc mb myminio/esag-thumbnails --ignore-existing;
      /usr/bin/mc anonymous set download myminio/esag-documents;
      /usr/bin/mc anonymous set download myminio/esag-thumbnails;
      echo 'MinIO buckets créés avec succès';
      exit 0;
      "
    networks:
      - esag_network

  # PgAdmin (optionnel - interface web pour PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: esag_ged_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@esag.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - esag_network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  esag_network:
    driver: bridge
