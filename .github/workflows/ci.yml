name: CI

on:
  push:
    branches: [main, wip_*, dev]
  pull_request:
    branches: [main, dev]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Run tests
        working-directory: backend
        run: go test ./... -v

      - name: Go vet
        working-directory: backend
        run: go vet ./...

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t archiflow-backend:test ./backend

      - name: Build frontend image
        run: docker build -t archiflow-frontend:test ./frontend

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104 ./backend/...

      - name: semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/ci

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./backend/...

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Trivy backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: archiflow-backend:test
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Trivy frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: archiflow-frontend:test
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: archiflow-backend:test
          format: spdx-json
          output-file: sbom-backend.json

      - name: SBOM frontend
        uses: anchore/sbom-action@v0
        with:
          image: archiflow-frontend:test
          format: spdx-json
          output-file: sbom-frontend.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.json

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend, build-images, security-scan]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start compose (core services only)
        run: |
          docker compose up -d --wait postgres pgbouncer redis minio minio-init
          sleep 10

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5010/readyz >/dev/null; then
              echo "Backend ready"
              break
            fi
            sleep 2
          done

      - name: Run smoke tests
        env:
          SMOKE_PASSWORD: Admin1234!
        run: |
          chmod +x scripts/smoke_e2e.sh
          SMOKE_PASSWORD=Admin1234! ./scripts/smoke_e2e.sh

      - name: WebSocket smoke test
        run: |
          node scripts/test-realtime-ws.mjs http://localhost:5010

      - name: Production env check
        run: |
          chmod +x scripts/check-prod-env.sh
          ./scripts/check-prod-env.sh

      - name: Cleanup
        if: always()
        run: docker compose down -v

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [integration-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack (core + office optional)
        run: |
          docker compose --profile office up -d --wait
          sleep 15

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Cleanup
        if: always()
        run: docker compose down -v

  nightly-zap:
    name: Nightly ZAP Scan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose up -d --wait
          sleep 30

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:3000
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Cleanup
        if: always()
        run: docker compose down -v