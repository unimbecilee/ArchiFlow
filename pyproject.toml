[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esag-ged"
version = "1.0.0"
description = "Système de Gestion Électronique de Documents (GED)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "black==24.1.1",
    "flake8==7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["AppFlask/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "venv", "env", ".venv"]

